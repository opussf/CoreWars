name: NodeJS with Gulp

on:
  push:
    branches:
      - master
      - develop
      - '**'
  pull_request:
    branches:
      - master
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node: [ 24 ]

    name: Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ matrix.node }}

      - name: Build
        run: |
          npm ci
          gulp
