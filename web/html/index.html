<!DOCTYPE html>
<html lang='en'>
    <head>
        <meta charset='utf-8'>
        <title>CoreWars</title>
        <link rel="icon" href="favicon.ico" type="image/x-icon">
        <link rel="stylesheet" href="corewars.css" type="text/css"/>
        <script src="corewars.js"></script>
    </head>
    <body onload="corewars_onload()">
        <h1>CoreWars!</h1>
        <table border="1">
            <tr>
                <td>
                    <canvas id="corewarsfield" width="768" height="768"></canvas>
                </td>
                <td>
                    <table border="1">
                        <tr><th>Prog1</th></tr>
                        <tr>
                            <td>
                                <textarea id="prog0" rows="20" cols="50" onblur="corewars_prog(this)"></textarea>
                            </td>
                        </tr>
                        <tr><th>Prog2</th></tr>
                        <tr>
                            <td>
                                <textarea id="prog1" rows="20" cols="50" onblur="corewars_prog(this)"></textarea>
                            </td>
                        </tr>
                    </table>
                </td>
                <td>
                    <textarea id="log" rows="45" cols="50"></textarea>
                </td>
            </tr>
            <tr>
                <td>
                    <button id="run" onclick="corewars_run()">Run</button>
                    <button id="stop" onclick="corewars_stop()">Stop</button>
                </td>
                <td>@VERSION@</td>
            </tr>
        </table>
    </body>
</html>
